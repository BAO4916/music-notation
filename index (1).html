<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notation</title>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
<style>
body{margin:0;font-family:sans-serif;background:#e9e9ee;display:flex;flex-direction:column;height:100vh;touch-action:manipulation}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;background:#fff;border-bottom:1px solid #bbb}
#bar button,#bar select,#bar input{font-size:16px;min-height:42px;min-width:42px;padding:0 10px}
button.on{background:#2e7dd7;color:#fff}
#wrap{flex:1;overflow:auto;padding:16px}
#page{background:#fff;margin:0 auto;width:fit-content;box-shadow:0 1px 6px #0003}
#msg{padding:8px 12px;background:#fff;border-top:1px solid #bbb;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div id="bar">
  <button id="mode"></button>
  <span id="durs"></span>
  <button id="dot">.</button><button id="rest">พัก</button>
  <button id="sharp">♯</button><button id="flat">♭</button><button id="nat">♮</button>
  <button id="up">▲</button><button id="down">▼</button><button id="del">ลบ</button>
  <button id="undo">↶</button><button id="redo">↷</button>
  <select id="key"></select><select id="time"></select>
  <label>♩=<input id="bpm" type="number" min="40" max="240" style="width:64px"></label>
  <button id="play">▶</button><button id="save">บันทึก</button><button id="open">เปิด</button>
  <input id="file" type="file" accept=".json" hidden>
</div>
<div id="wrap"><div id="page"></div></div>
<div id="msg"></div>
<script>
const {Renderer,Stave,StaveNote,Voice,Formatter,Beam,Accidental,Dot}=Vex.Flow;
const $=i=>document.getElementById(i);
const KEYS={C:0,G:1,D:2,A:3,E:4,B:5,"F#":6,F:-1,Bb:-2,Eb:-3,Ab:-4,Db:-5,Gb:-6};
const TIMES={"4/4":16,"2/4":8,"3/4":12,"6/8":12,"2/2":16};
const DURS=[["w",16],["h",8],["q",4],["8",2],["16",1]];
const L="cdefgab",MID={c:0,d:2,e:4,f:5,g:7,a:9,b:11},SH="fcgdaeb",FL="beadgcf";
let S={key:"C",time:"4/4",bpm:100,measures:[[]]};   // เหตุการณ์: {k:"c/4" หรือ null=ตัวหยุด, d:"q", dot:false}
let cur={d:"q",dot:false,rest:false,acc:null,input:true},sel=null,hist=[],fut=[],hits=[],rows=[];
let ac,nodes=[],endTimer;

const un=e=>DURS.find(d=>d[0]==e.d)[1]*(e.dot?1.5:1);
const cap=()=>TIMES[S.time];
const used=m=>m.reduce((a,e)=>a+un(e),0);
const msg=t=>$("msg").textContent=t||"";
const commit=()=>{hist.push(JSON.stringify(S));fut=[];};
const ev=()=>sel&&S.measures[sel.m]&&S.measures[sel.m][sel.i];
function keyAcc(l){const n=KEYS[S.key];return n>0&&SH.slice(0,n).includes(l)?"#":n<0&&FL.slice(0,-n).includes(l)?"b":"";}
const parse=k=>{const m=k.match(/^([a-g])(#|b)?\/(\d)$/);return{l:m[1],a:m[2]||"",o:+m[3]};};
const midi=k=>{const p=parse(k);return 12*(p.o+1)+MID[p.l]+(p.a=="#"?1:p.a=="b"?-1:0);};
const dia=p=>p.o*7+L.indexOf(p.l);
const fromDia=(d,a)=>{const l=L[d%7];return l+(a===null?keyAcc(l):a)+"/"+Math.floor(d/7);};

// ---------- วาดโน้ต ----------
function draw(){
  const page=$("page");page.innerHTML="";
  const W=Math.max(320,Math.min(1000,$("wrap").clientWidth-32));
  const n=Math.max(1,Math.floor((W-80)/170));
  const nr=Math.ceil(S.measures.length/n);
  const r=new Renderer(page,Renderer.Backends.SVG);r.resize(W,nr*130+20);
  const ctx=r.getContext();hits=[];rows=[];
  for(let row=0;row<nr;row++){
    const top=10+row*130;
    const extra=45+Math.abs(KEYS[S.key])*10+(row==0?30:0);
    const base=(W-20-extra)/n;let x=10,y0=top+40;
    rows.push({top,y0});
    for(let j=0;j<n;j++){
      const mi=row*n+j;if(mi>=S.measures.length)break;
      const w=base+(j==0?extra:0);
      const st=new Stave(x,top,w);
      if(j==0){st.addClef("treble").addKeySignature(S.key);if(row==0)st.addTimeSignature(S.time);}
      st.setContext(ctx).draw();x+=w;
      const evs=S.measures[mi];if(!evs.length)continue;
      const notes=evs.map((e,i)=>{
        const nn=new StaveNote({keys:[e.k||"b/4"],duration:e.d+(e.dot?"d":"")+(e.k?"":"r"),auto_stem:true});
        if(e.dot)Dot.buildAndAttach([nn],{all:true});
        if(sel&&sel.m==mi&&sel.i==i)nn.setStyle({fillStyle:"#2e7dd7",strokeStyle:"#2e7dd7"});
        return nn;});
      const v=new Voice({num_beats:4,beat_value:4});v.setStrict(false);v.addTickables(notes);
      Accidental.applyAccidentals([v],S.key);
      new Formatter().joinVoices([v]).formatToStave([v],st);
      const beams=Beam.generateBeams(notes);
      v.draw(ctx,st);beams.forEach(b=>b.setContext(ctx).draw());
      notes.forEach((nn,i)=>hits.push({m:mi,i,x:nn.getAbsoluteX(),y0}));
    }
  }
  try{localStorage.setItem("score",JSON.stringify(S));}catch(e){}
  ui();
}

// ---------- เสียง ----------
function tone(m,delay,dur){
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;
  o.type="triangle";o.frequency.value=440*Math.pow(2,(m-69)/12);
  g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.05);return o;
}
const audio=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();};
function sound(k){audio();tone(midi(k),0,0.4);}
function stopAll(){nodes.forEach(o=>{try{o.stop()}catch(e){}});nodes=[];clearTimeout(endTimer);$("play").textContent="▶";}
function play(){
  if(nodes.length){stopAll();return;}
  audio();const spu=60/S.bpm/4;let t=0.1;
  S.measures.flat().forEach(e=>{const d=un(e)*spu;if(e.k)nodes.push(tone(midi(e.k),t,d*0.95));t+=d;});
  $("play").textContent="■";endTimer=setTimeout(stopAll,t*1000+300);
}

// ---------- แก้ไข ----------
function add(e){
  let m=S.measures.at(-1);
  if(used(m)>=cap()-1e-9){m=[];S.measures.push(m);}
  if(used(m)+un(e)>cap()+1e-9){msg("เกินห้องเพลง: เลือกค่าตัวโน้ตที่สั้นลง");return false;}
  m.push(e);return true;
}
function setDur(d){
  const e=ev();
  if(e){const old=e.d;commit();e.d=d;if(used(S.measures[sel.m])>cap()+1e-9){e.d=old;hist.pop();msg("เกินห้องเพลง");}}
  else cur.d=d;
  draw();
}
function toggleDot(){
  const e=ev();
  if(e){commit();e.dot=!e.dot;if(used(S.measures[sel.m])>cap()+1e-9){e.dot=!e.dot;hist.pop();msg("เกินห้องเพลง");}}
  else cur.dot=!cur.dot;
  draw();
}
function setAcc(a){
  const e=ev();
  if(e&&e.k){commit();const p=parse(e.k);e.k=p.l+a+"/"+p.o;sound(e.k);}
  else cur.acc=cur.acc===a?null:a;
  draw();
}
function move(dir){
  const e=ev();if(!e||!e.k)return;
  commit();e.k=fromDia(dia(parse(e.k))+dir,null);sound(e.k);draw();
}
function del(){
  const e=ev();if(!e)return;
  commit();
  if(e.k)e.k=null;
  else if(sel.m==S.measures.length-1&&sel.i==S.measures[sel.m].length-1){S.measures[sel.m].pop();sel=null;}
  draw();
}
$("page").onclick=ev0=>{
  const sv=$("page").querySelector("svg");if(!sv)return;
  const b=sv.getBoundingClientRect(),x=ev0.clientX-b.left,y=ev0.clientY-b.top;
  const h=hits.find(h=>Math.abs(h.x-x)<12&&y>h.y0-30&&y<h.y0+80);
  if(h){sel={m:h.m,i:h.i};const e=ev();if(e&&e.k)sound(e.k);draw();return;}
  if(!cur.input){sel=null;draw();return;}
  const row=rows.find(r=>y>=r.top&&y<r.top+130);if(!row)return;
  let step=Math.round((y-row.y0)/5);step=Math.max(-4,Math.min(12,step));
  const k=cur.rest?null:fromDia(38-step,cur.acc);   // 38 = f/5 (เส้นบนสุด)
  const snap=JSON.stringify(S);
  if(add({k,d:cur.d,dot:cur.dot})){hist.push(snap);fut=[];if(k)sound(k);cur.acc=null;sel=null;msg("");}
  else S=JSON.parse(snap);
  draw();
};
function undo(){if(!hist.length)return;fut.push(JSON.stringify(S));S=JSON.parse(hist.pop());sel=null;sync();draw();}
function redo(){if(!fut.length)return;hist.push(JSON.stringify(S));S=JSON.parse(fut.pop());sel=null;sync();draw();}

// ---------- แถบเครื่องมือ ----------
function ui(){
  const c=ev()||cur;
  document.querySelectorAll("#durs button").forEach(b=>b.classList.toggle("on",b.dataset.d==c.d));
  $("dot").classList.toggle("on",!!c.dot);$("rest").classList.toggle("on",cur.rest);
  $("mode").classList.toggle("on",cur.input);$("mode").textContent=cur.input?"✎ เขียนโน้ต":"⬚ เลือก";
  $("sharp").classList.toggle("on",cur.acc==="#");$("flat").classList.toggle("on",cur.acc==="b");$("nat").classList.toggle("on",cur.acc==="");
}
function sync(){$("key").value=S.key;$("time").value=S.time;$("bpm").value=S.bpm;}
DURS.forEach(([d],i)=>{const b=document.createElement("button");b.textContent=["1","1/2","1/4","1/8","1/16"][i];b.dataset.d=d;b.onclick=()=>setDur(d);$("durs").append(b);});
Object.keys(KEYS).forEach(k=>$("key").add(new Option(k+" major",k)));
Object.keys(TIMES).forEach(t=>$("time").add(new Option(t,t)));
$("mode").onclick=()=>{cur.input=!cur.input;draw();};
$("dot").onclick=toggleDot;
$("rest").onclick=()=>{cur.rest=!cur.rest;draw();};
$("sharp").onclick=()=>setAcc("#");$("flat").onclick=()=>setAcc("b");$("nat").onclick=()=>setAcc("");
$("up").onclick=()=>move(1);$("down").onclick=()=>move(-1);$("del").onclick=del;
$("undo").onclick=undo;$("redo").onclick=redo;$("play").onclick=play;
$("key").onchange=()=>{commit();S.key=$("key").value;draw();};
$("time").onchange=()=>{
  commit();S.time=$("time").value;const evs=S.measures.flat();S.measures=[[]];
  evs.forEach(e=>{if(un(e)>cap())return;let m=S.measures.at(-1);if(used(m)+un(e)>cap()+1e-9){m=[];S.measures.push(m);}m.push(e);});
  sel=null;draw();
};
$("bpm").onchange=()=>{S.bpm=+$("bpm").value||100;draw();};
$("save").onclick=()=>{
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));
  a.download="score.json";a.click();
};
$("open").onclick=()=>$("file").click();
$("file").onchange=()=>{
  const f=$("file").files[0];if(!f)return;
  f.text().then(t=>{try{S=JSON.parse(t);hist=[];fut=[];sel=null;sync();draw();}catch(e){msg("เปิดไฟล์ไม่ได้");}});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName=="INPUT"||e.target.tagName=="SELECT")return;
  if(e.key=="ArrowUp"){e.preventDefault();move(1);}
  else if(e.key=="ArrowDown"){e.preventDefault();move(-1);}
  else if(e.key=="Delete"||e.key=="Backspace")del();
  else if((e.ctrlKey||e.metaKey)&&e.key=="z"){e.preventDefault();undo();}
});
window.addEventListener("resize",draw);
try{const s=localStorage.getItem("score");if(s)S=JSON.parse(s);}catch(e){}
sync();msg("เลือกค่าตัวโน้ต แล้วแตะบนบรรทัดเพื่อวางโน้ต แตะที่โน้ตเพื่อเลือกแล้วแก้ไข");
draw();
</script>
</body>
</html>
