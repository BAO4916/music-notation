<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>บทเรียนที่ 2: บรรทัด 5 เส้น</title>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 40px; }
    #score { display: inline-block; background: white; }
    button { font-size: 20px; padding: 12px 28px; margin-top: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>บทเรียนที่ 2: บรรทัด 5 เส้น</h1>
  <div id="score"></div><br>
  <button id="playBtn">▶ เล่น</button>

  <script>
    // ส่วนที่ 1: ข้อมูลโน้ต (เก็บแยกจากหน้าตา)
    const melody = [
      { key: "c/4", freq: 261.63 },
      { key: "d/4", freq: 293.66 },
      { key: "e/4", freq: 329.63 },
      { key: "f/4", freq: 349.23 }
    ];

    // ส่วนที่ 2: วาดโน้ตจากข้อมูลข้างบน
    const { Renderer, Stave, StaveNote, Voice, Formatter } = Vex.Flow;
    const renderer = new Renderer(document.getElementById("score"), Renderer.Backends.SVG);
    renderer.resize(420, 160);
    const context = renderer.getContext();

    const stave = new Stave(10, 20, 390);
    stave.addClef("treble").addTimeSignature("4/4");
    stave.setContext(context).draw();

    const notes = melody.map(n => new StaveNote({ keys: [n.key], duration: "q" }));
    const voice = new Voice({ num_beats: 4, beat_value: 4 });
    voice.addTickables(notes);
    new Formatter().joinVoices([voice]).format([voice], 300);
    voice.draw(context, stave);

    // ส่วนที่ 3: เล่นเสียงจากข้อมูลชุดเดียวกัน
    const audio = new (window.AudioContext || window.webkitAudioContext)();

    function playNote(freq, when) {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.5, when);
      gain.gain.exponentialRampToValueAtTime(0.001, when + 0.45);
      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start(when);
      osc.stop(when + 0.5);
    }

    document.getElementById("playBtn").onclick = () => {
      audio.resume();
      const beat = 0.5; // โน้ตตัวดำละครึ่งวินาที
      melody.forEach((n, i) => playNote(n.freq, audio.currentTime + i * beat));
    };
  </script>
</body>
</html>
